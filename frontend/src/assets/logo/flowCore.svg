<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 56" fill="none">
  <defs>
    <linearGradient id="fc-grad" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="fc-glow" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="fc-text" x1="60" y1="0" x2="280" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#e0f2fe"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
  </defs>

  <!-- Glow circle behind -->
  <circle cx="24" cy="28" r="24" fill="url(#fc-glow)"/>

  <!-- Outer ring -->
  <circle cx="24" cy="28" r="20" stroke="url(#fc-grad)" stroke-width="3" fill="none"/>

  <!-- Core dot -->
  <circle cx="24" cy="28" r="6" fill="url(#fc-grad)"/>

  <!-- Flow wave through the circle -->
  <path d="M8 28 C14 20, 20 36, 26 28 C32 20, 38 36, 40 28" stroke="url(#fc-grad)" stroke-width="2.5" stroke-linecap="round" fill="none"/>

  <!-- Text: FlowCore -->
  <text x="58" y="36" font-family="'Inter', 'SF Pro Display', system-ui, -apple-system, sans-serif" font-size="28" font-weight="700" fill="url(#fc-text)" letter-spacing="-0.5">
    <tspan fill="url(#fc-grad)">Flow</tspan><tspan fill="url(#fc-text)">Core</tspan>
  </text>
</svg>
